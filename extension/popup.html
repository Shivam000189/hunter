<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hunter — Job Clipper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-icon">🎯</div>
        <div class="brand-text">
          <span class="title">Hunter</span>
          <span class="subtitle">Job Clipper</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="toggleSettingsBtn" class="icon-btn" title="API Settings">⚙️</button>
      </div>
    </header>

    <!-- Settings Drawer (Collapsible) -->
    <section id="settingsSection" class="settings-panel hidden">
      <div class="form-group">
        <label for="apiUrl">Backend API URL</label>
        <input type="text" id="apiUrl" placeholder="http://localhost:5000" value="http://localhost:5000">
      </div>
      <div class="form-group">
        <label for="authToken">JWT Auth Token</label>
        <input type="password" id="authToken" placeholder="Paste Bearer Token from Hunter">
        <span class="help-text">Copy your token from localStorage or Hunter settings.</span>
      </div>
      <button id="saveSettingsBtn" class="btn btn-secondary">Save Configuration</button>
    </section>

    <!-- Status Badge -->
    <div id="statusBadge" class="status-badge checking">
      <span class="dot"></span>
      <span id="statusText">Checking connection...</span>
    </div>

    <!-- Main Form -->
    <main id="mainForm" class="content">
      <div class="form-group">
        <label for="company">Company <span class="required">*</span></label>
        <input type="text" id="company" placeholder="e.g. Stripe, Google, Acme Inc">
      </div>

      <div class="form-group">
        <label for="role">Role / Position <span class="required">*</span></label>
        <input type="text" id="role" placeholder="e.g. Senior Full-Stack Engineer">
      </div>

      <div class="form-group">
        <label for="jobUrl">Job Posting URL</label>
        <input type="url" id="jobUrl" placeholder="https://...">
      </div>

      <div class="form-group">
        <label for="notes">Notes & Requirements</label>
        <textarea id="notes" rows="3" placeholder="Key skills, tech stack, salary range, or notes..."></textarea>
      </div>

      <div id="feedbackMessage" class="feedback-message hidden"></div>

      <button id="clipBtn" class="btn btn-primary">
        <span class="btn-icon">📥</span>
        <span class="btn-text">Clip to Hunter</span>
      </button>
    </main>

    <!-- Success View -->
    <section id="successView" class="success-panel hidden">
      <div class="success-icon">✓</div>
      <h3>Job Saved to Hunter!</h3>
      <p id="savedJobSummary" class="saved-summary"></p>
      <div class="success-actions">
        <button id="clipAnotherBtn" class="btn btn-secondary">Clip Another</button>
        <a id="openDashboardBtn" href="http://localhost:5173/jobs" target="_blank" class="btn btn-primary link-btn">Open Kanban Board</a>
      </div>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
